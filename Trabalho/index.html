<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Arwing - Corneria</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding-top: 20px;
        }
        canvas {
            border: 2px solid #fff;
            margin-top: 15px;
            border-radius: 4px;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .legenda {
            background: #333;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #555;
            max-width: 760px;
        }
        .legenda p { margin: 5px 0; }
        .legenda .teclas { color: #9cd0ff; }
        #hud {
            background: #111;
            color: #7fff9c;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 12px;
            border: 1px solid #444;
        }
        #hud strong { color: #fff; }
    </style>
</head>
<body>

    <div class="legenda">
        <p><strong>STAR FOX - ARWING SOBREVOANDO CORNERIA</strong></p>
        <p class="teclas"><strong>Câmeras:</strong> 1 Orbital &nbsp;|&nbsp; 2 Perseguição &nbsp;|&nbsp; 3 Torre fixa &nbsp;|&nbsp; 4 Visão superior &nbsp;|&nbsp; C cicla</p>
        <p class="teclas"><strong>Luzes:</strong> Z liga/desliga Sol &nbsp;|&nbsp; X liga/desliga Holofote &nbsp;|&nbsp; F liga/desliga Névoa</p>
        <p><strong>Mouse (arrastar)</strong> : girar câmera orbital &nbsp;|&nbsp; <strong>Scroll</strong> : zoom &nbsp;|&nbsp; <strong>Espaço</strong> : rotação automática</p>
    </div>

    <div id="hud"></div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <script src="m4.js"></script>
    <script src="arwingGeometry.js"></script>
    <script src="sceneGeometry.js"></script>
    <script src="main.js"></script>

</body>
</html>
