<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Exercício 1 - Linha com Bresenham</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #222;
      color: #eee;
    }
    canvas {
      background: #ffffff;
      border: 1px solid #555;
      margin-top: 16px;
      cursor: crosshair;
    }
    #info {
      margin-top: 8px;
      font-size: 14px;
      max-width: 600px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Exercício 1 — Traçado de reta (Bresenham)</h2>
  <div id="info">
    Clique em dois pontos do canvas para traçar uma reta entre eles.<br>
    Pressione as teclas <b>0</b> a <b>9</b> para mudar a cor da próxima reta.
  </div>
  <canvas id="canvas" width="600" height="400"></canvas>

  <script src="main.js"></script>
</body>
</html>
